name: Keep Render Backend Alive

on:
  schedule:
    # Пинг каждые 10 минут, чтобы Render Free Tier не засыпал (таймаут сна на Render — 15 минут)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging https://ebike-ai-router.onrender.com/health..."
          curl -sSf --retry 2 --max-time 60 https://ebike-ai-router.onrender.com/health || echo "Ping sent"
